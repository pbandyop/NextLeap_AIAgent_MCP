[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-agent"
version = "0.1.0"
description = "Weekly Product Review Pulse — single MCP agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0",
    "google-play-scraper>=1.2.7",
    "langdetect>=1.0.9",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
analysis = [
    "sentence-transformers>=3.0.0",
    "umap-learn>=0.5.0",
    "hdbscan>=0.8.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
pulse = "pulse_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires live MCP servers",
    "live_ingestion: requires network and store APIs",
    "live_llm: requires GROQ_API_KEY and network",
]
testpaths = ["tests"]
